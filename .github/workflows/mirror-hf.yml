name: mirror-hf
on:
  push:
    branches: [main]
    paths: ['art/**', 'docs/**', 'tools/runpod/**', '.github/workflows/**']
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "huggingface_hub[cli]" jsonschema
      - run: python tools/validate_manifests.py
      - run: bash tools/mirror_hf.sh text
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
